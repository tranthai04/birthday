<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>Birthday Love Surprise</title>

  <style>

    /* =========================
       CƠ BẢN
       ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        circle at top,
        #fff0f7,
        #ffd6e7,
        #ffb6d0
      );

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      padding: 18px;
    }


    /* =========================
       KHUNG CHÍNH
       ========================= */

    .app {
      width: 100%;
      max-width: 450px;

      height: min(calc(100vh - 36px), 800px);

      background: rgba(255, 255, 255, 0.92);

      border-radius: 32px;
      padding: 24px;

      text-align: center;

      position: relative;

      overflow-x: hidden;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;

      box-shadow:
        0 25px 70px rgba(255, 70, 140, 0.35);

      animation: pop 0.6s ease;

      z-index: 3;
    }

    .app::-webkit-scrollbar {
      width: 6px;
    }

    .app::-webkit-scrollbar-track {
      background: transparent;
    }

    .app::-webkit-scrollbar-thumb {
      background: #ff8fba;
      border-radius: 10px;
    }


    /* =========================
       ANIMATION KHUNG
       ========================= */

    @keyframes pop {

      from {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

    }


    /* =========================
       PROGRESS
       ========================= */

    .progress {
      width: 100%;
      height: 9px;

      background: #ffe1ef;

      border-radius: 100px;

      margin-bottom: 18px;

      overflow: hidden;
    }

    .progress span {
      display: block;

      height: 100%;
      width: 16.66%;

      border-radius: 100px;

      background:
        linear-gradient(
          135deg,
          #ff4f9a,
          #ff2474
        );

      transition: 0.4s ease;
    }


    /* =========================
       BADGE
       ========================= */

    .badge {
      display: inline-block;

      background: #fff0f7;
      color: #ff3f87;

      padding: 7px 15px;

      border-radius: 50px;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 14px;
    }


    /* =========================
       TEXT
       ========================= */

    h1 {
      color: #ff2f7d;

      font-size: 28px;

      line-height: 1.25;

      margin-bottom: 10px;
    }

    p {
      color: #70495b;

      font-size: 15px;

      line-height: 1.7;

      margin-bottom: 15px;
    }


    /* =========================
       INPUT
       ========================= */

    input {
      width: 100%;

      border: 2px solid #ffd0e4;

      outline: none;

      border-radius: 16px;

      padding: 14px 16px;

      text-align: center;

      color: #ff2f7d;

      font-size: 15px;

      margin-bottom: 14px;
    }

    input:focus {
      border-color: #ff5f9e;
    }


    /* =========================
       ẢNH CÔ GÁI
       ========================= */

    .girl-card {
      width: 135px;
      height: 135px;

      margin: 8px auto 14px;

      border-radius: 50%;

      padding: 5px;

      background:
        linear-gradient(
          135deg,
          #ff5f9e,
          #ffd166,
          #ff8fab
        );

      box-shadow:
        0 15px 35px
        rgba(255, 79, 154, 0.28);

      animation:
        softFloat 3s
        ease-in-out infinite;
    }

    .girl-card img {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;

      border: 4px solid white;
    }

    @keyframes softFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

    }


    /* =========================
       GIF / EMOJI
       ========================= */

    .cute-gif {
      width: 190px;
      height: 170px;

      margin: 10px auto 18px;

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          #fff7fb,
          #ffe2ef
        );

      border: 2px solid #ffd0e4;

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

      box-shadow:
        0 14px 30px
        rgba(255, 79, 154, 0.2);
    }

    .cute-gif::before,
    .cute-gif::after {

      content: "💖";

      position: absolute;

      font-size: 26px;

      animation:
        flyHeart 3s
        infinite
        ease-in-out;
    }

    .cute-gif::before {
      left: 20px;
      bottom: 22px;
    }

    .cute-gif::after {
      right: 22px;
      top: 25px;

      animation-delay: 0.8s;
    }

    .gif-emoji {
      font-size: 78px;

      animation:
        bounce 1.3s
        infinite
        ease-in-out;

      z-index: 2;
    }


    /* =========================
       SPARKLE
       ========================= */

    .sparkle {
      position: absolute;

      font-size: 18px;

      animation:
        sparkle 1.8s
        infinite
        ease-in-out;
    }

    .sparkle.one {
      left: 35px;
      top: 30px;
    }

    .sparkle.two {
      right: 38px;
      bottom: 30px;

      animation-delay: 0.5s;
    }

    .sparkle.three {
      left: 78px;
      bottom: 18px;

      animation-delay: 1s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-12px)
          scale(1.07);
      }

    }

    @keyframes flyHeart {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);

        opacity: 0.8;
      }

      50% {
        transform:
          translateY(-20px)
          scale(1.2);

        opacity: 1;
      }

    }

    @keyframes sparkle {

      0%,
      100% {
        transform:
          scale(0.7)
          rotate(0deg);

        opacity: 0.5;
      }

      50% {
        transform:
          scale(1.3)
          rotate(25deg);

        opacity: 1;
      }

    }


    /* =========================
       LOVE NOTE
       ========================= */

    .love-note {
      background: #fff5fa;

      border: 1.5px dashed #ff8fba;

      border-radius: 18px;

      padding: 14px;

      color: #ff3f87;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 14px;
    }


    /* =========================
       BUTTON
       ========================= */

    .buttons {
      display: flex;

      gap: 10px;

      margin-top: 14px;
    }
.exit-letter-btn {
  margin-top: 18px;
  padding: 11px 24px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #ff5f9e, #ff2474);
  color: white;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(255,70,140,.25);
  transition: .2s ease;
}

.exit-letter-btn:hover {
  transform: translateY(-2px);
}

.exit-letter-btn:active {
  transform: scale(.95);
}
    button {
      border: none;

      border-radius: 16px;

      padding: 13px 18px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.25s ease;

      font-size: 14px;
    }

    .btn-main {
      flex: 1;

      color: white;

      background:
        linear-gradient(
          135deg,
          #ff5f9e,
          #ff2474
        );

      box-shadow:
        0 10px 24px
        rgba(255, 36, 116, 0.35);
    }

    .btn-main:hover {
      transform: translateY(-2px);
    }

    .btn-soft {
      color: #ff3f87;

      background: #fff0f7;
    }


    /* =========================
       GAME BẮT TIM
       ========================= */

    .game-box {
      height: 220px;

      background:
        linear-gradient(
          180deg,
          #fff7fb,
          #ffe2ef
        );

      border: 2px dashed #ff95bd;

      border-radius: 24px;

      position: relative;

      overflow: hidden;

      margin-top: 14px;
    }

    .heart-game {
      position: absolute;

      top: -40px;

      font-size: 32px;

      cursor: pointer;

      animation:
        fall 3s
        linear forwards;

      user-select: none;
    }

    @keyframes fall {

      to {
        top: 235px;
      }

    }

    .score {
      color: #ff2f7d;

      font-weight: 800;

      margin-top: 10px;
    }


    /* =========================
       ẨN
       ========================= */

    .hidden {
      display: none;
    }


    /* =========================
       =========================
       TRÒ CHƠI LẬT THẺ
       =========================
       ========================= */

    .memory-info {
      color: #ff3f87;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 12px;
    }

    .memory-board {

      width: 100%;

      max-width: 380px;

      margin: 15px auto;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      perspective: 1000px;
    }


    /* THẺ */

    .memory-card {

      aspect-ratio: 1 / 1;

      position: relative;

      cursor: pointer;

      perspective: 1000px;

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }

    .memory-card.matched {

      opacity: 0;

      transform:
        scale(0)
        rotate(20deg);

      pointer-events: none;
    }

    .memory-card-inner {

      width: 100%;
      height: 100%;

      position: relative;

      transform-style: preserve-3d;

      transition:
        transform 0.5s
        cubic-bezier(
          0.4,
          0.2,
          0.2,
          1
        );
    }

    .memory-card.flipped
    .memory-card-inner {

      transform:
        rotateY(180deg);
    }


    /* MẶT TRƯỚC / SAU */

    .memory-card-front,
    .memory-card-back {

      position: absolute;

      width: 100%;
      height: 100%;

      border-radius: 16px;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      box-shadow:
        0 8px 18px
        rgba(255, 79, 154, 0.18);
    }


    /* MẶT ÚP */

    .memory-card-front {

      background:
        linear-gradient(
          135deg,
          #ff5f9e,
          #ff2474
        );

      border:
        3px solid white;

      color: white;

      font-size: 28px;
    }

    .memory-card-front::before {

      content: "💖";

      filter:
        drop-shadow(
          0 3px 5px
          rgba(0,0,0,0.12)
        );
    }


    /* MẶT ẢNH */

    .memory-card-back {

      background: white;

      border:
        3px solid #ffd0e4;

      transform:
        rotateY(180deg);
    }

    .memory-card-back img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* THÔNG BÁO TRÒ CHƠI */

    .memory-message {

      min-height: 48px;

      color: #ff2f7d;

      font-size: 15px;

      font-weight: 800;

      line-height: 1.5;

      margin-top: 8px;
    }


    /* HIỆU ỨNG MATCH */

    @keyframes matchPop {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(0);
      }

    }


    /* =========================
       CAKE CUTTING
       ========================= */

    .cake-cut-area {

      position: relative;

      width: 100%;

      max-width: 430px;

      height: 300px;

      margin: 15px auto 20px;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      touch-action: pan-y;

      cursor: grab;
    }

    .cake-cut-area:active {
      cursor: grabbing;
    }


    /* BÁNH NGUYÊN */

    .cake-whole-image {

      position: absolute;

      top: 50%;
      left: 50%;

      width: 430px;

      max-width: none;

      height: auto;

      transform:
        translate(
          -50%,
          -50%
        );

      user-select: none;

      pointer-events: none;

      -webkit-user-drag: none;

      z-index: 4;

      transition:
        opacity 0.25s ease;
    }


    /* BÁNH SAU KHI CẮT */

    .birthday-cake-image {

      position: absolute;

      top: 50%;
      left: 50%;

      width: 430px;

      max-width: none;

      height: auto;

      transform:
        translate(
          -50%,
          -50%
        )
        scale(0.96);

      user-select: none;

      pointer-events: none;

      -webkit-user-drag: none;

      z-index: 3;

      opacity: 0;

      transition:
        opacity 0.25s ease,
        transform 0.9s ease;
    }

    .cake-cut-area.cutting
    .cake-whole-image {

      opacity: 0;
    }

    .cake-cut-area.cutting
    .birthday-cake-image {

      opacity: 1;

      transform:
        translate(
          -50%,
          -50%
        )
        scale(1);

      filter:
        brightness(1.08);
    }


    /* =========================
       SIGNATURE
       ========================= */

    .signature {

      color: #ff2f7d;

      font-size: 19px;

      font-weight: 900;

      margin-top: 12px;
    }


    /* =========================
       TIM / CONFETTI
       ========================= */

    .floating-heart {

      position: fixed;

      bottom: -30px;

      font-size: 24px;

      pointer-events: none;

      animation:
        floatUp 6s
        linear forwards;

      z-index: 1;
    }

    @keyframes floatUp {

      from {

        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0.9;
      }

      to {

        transform:
          translateY(-110vh)
          rotate(360deg);

        opacity: 0;
      }

    }


    .confetti {

      position: fixed;

      top: -20px;

      width: 10px;
      height: 10px;

      pointer-events: none;

      animation:
        confettiFall 3s
        linear forwards;

      z-index: 10;
    }

    @keyframes confettiFall {

      to {

        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0;
      }

    }
/* =========================
   LOVE LETTER
========================= */

.letter-area {
  width: 100%;
  max-width: 390px;
  margin: 20px auto;
  text-align: center;
}

.letter-area h1 {
  margin-bottom: 5px;
}

.envelope {
  position: relative;
  width: 300px;
  height: 200px;
  margin: 65px auto 20px;
  cursor: pointer;
  animation: envelopeFloat 2s ease-in-out infinite;
}

@keyframes envelopeFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

.envelope-body {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 150px;
  background: linear-gradient(135deg, #ff9fc4, #ff6fa8);
  border-radius: 0 0 18px 18px;
  box-shadow: 0 12px 25px rgba(255,70,140,.25);
  z-index: 2;
}

.envelope-flap {
  position: absolute;
  top: 25px;
  left: 0;
  width: 0;
  height: 0;

  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-top: 105px solid #ff4f91;

  transform-origin: top center;
  transition: transform .8s ease;

  z-index: 5;
}

.envelope-heart {
  position: absolute;
  left: 50%;
  top: 92px;

  transform: translate(-50%, -50%);

  font-size: 42px;

  z-index: 6;

  transition: opacity .3s ease;
}

.letter-paper {
  position: absolute;
  left: 50%;
  top: 45px;
  transform: translateX(-50%) translateY(0);

  width: 350px;
  max-width: 90vw;
  max-height: 430px;

  padding: 25px 24px;
  background: #fffdf7;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,.15);

  z-index: 3;
  opacity: 0;

  transition: transform 1s ease, opacity .5s ease;

  pointer-events: none;
  text-align: left;

  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
}

.envelope.opened {
  animation: none;
}

.envelope.opened .envelope-flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.envelope.opened .envelope-heart {
  opacity: 0;
}

.envelope.opened .letter-paper {
  transform:
    translateX(-50%)
    translateY(-175px);

  opacity: 1;

  pointer-events: auto;
}

.letter-title {
  text-align: center;

  color: #ff3d82;

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 15px;
}

.letter-content {
  color: #555;

  font-size: 14px;

  line-height: 1.75;

  white-space: pre-line;
}

.letter-sign {
  text-align: right;

  margin-top: 18px;

  color: #ff3d82;

  font-weight: 800;
}

.letter-hint {
  color: #ff4f91;

  font-size: 14px;

  font-weight: 700;

  margin-top: 15px;
}

@media (max-width: 480px) {

  .envelope {
    width: 280px;
    height: 185px;
  }

  .envelope-flap {
    border-left-width: 140px;
    border-right-width: 140px;
    border-top-width: 100px;
  }

  @media(max-width:480px) {
  .letter-paper {
    width: 320px;
    max-width: 88vw;
    max-height: 400px;
    padding: 22px 20px;
  }

  .letter-content {
    font-size: 13px;
    line-height: 1.7;
  }
}

}

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      body {

        min-height: 100dvh;

        height: 100dvh;

        padding: 10px;

        align-items: center;
      }

      .app {

        width: 100%;

        height:
          calc(100dvh - 20px);

        max-height:

        -webkit-overflow-scrolling:

      }

      h1 {

      }

      .cute-gif {

      }

      .gif-emoji {

      }


      /* THẺ NHỎ HƠN */

      .memory-board {

        grid-template-columns:
          repeat(3, 1fr);

        gap: 9px;
      }

      .memory-card-front {

      }

      .cake-cut-area {
        height: 250px;
      }

      .birthday-cake-image,
      .cake-whole-image {
        width: 360px;
      }

    }

</head>

<body>

  <div class="app">

    <!-- THANH TIẾN TRÌNH -->

    <div class="progress">
      <span id="progressBar"></span>
    </div>

    <div
      class="badge"
      id="stepBadge"
    >
      Step 1 of 7
    </div>


    <!-- NỘI DUNG -->

    <div id="content"></div>


    <!-- NÚT -->

    <div class="buttons">

      <button
        class="btn-soft"
        id="backBtn"
      >
        Trở lại
      </button>

      <button
        class="btn-main"
        id="nextBtn"
      >
        Tiếp tục
      </button>

    </div>

  </div>


  <script>

    /* =========================
       BIẾN
       ========================= */

    let currentStep = 0;

    let birthdayName =
      "Beautiful Girl";

    let gameScore = 0;

    let gameStarted = false;

    let heartInterval;


    /* =========================
       BIẾN LẬT THẺ
       ========================= */

    let flippedCards = [];

    let matchedPairs = 0;

    let memoryLocked = false;


    /* =========================
       BIẾN CẮT BÁNH
       ========================= */

    let touchStartY = 0;

    let mouseStartY = 0;

    let isDragging = false;

    let cakeCutDone = false;


    /* =========================
       ELEMENT
       ========================= */

    const content =
      document.getElementById(
        "content"
      );

    const stepBadge =
      document.getElementById(
        "stepBadge"
      );

    const progressBar =
      document.getElementById(
        "progressBar"
      );

    const backBtn =
      document.getElementById(
        "backBtn"
      );

    const nextBtn =
      document.getElementById(
        "nextBtn"
      );


    /* =========================
       ẢNH CÔ GÁI
       ========================= */

    const girlPictures = [

      "image01.JPG",
      "image02.JPG",
      "image03.JPG"

    ];

    const randomGirlPicture =
      girlPictures[
        Math.floor(
          Math.random()
          *
          girlPictures.length
        )
      ];


    /* =========================
       ẢNH CHO TRÒ LẬT THẺ
       =========================

       Bạn tự thay các file này.

       Cần 6 ảnh:

       card01.jpg
       card02.jpg
       card03.jpg
       card04.jpg
       card05.jpg
       card06.jpg

       Mỗi ảnh sẽ xuất hiện 2 lần.
       ========================= */

    const cardImages = [

      "card01.jpg",
      "card02.jpg",
      "card03.jpg",
      "card04.jpg",
      "card05.jpg",
      "card06.jpg"

    ];


    /* =========================
       CUTE GIF
       ========================= */

    function cuteGif(emoji) {

      return `

        <div class="cute-gif">

          <span
            class="sparkle one"
          >
            ✨
          </span>

          <span
            class="sparkle two"
          >
            🌸
          </span>

          <span
            class="sparkle three"
          >
            ✨
          </span>

          <div class="gif-emoji">
            ${emoji}
          </div>

        </div>

      `;

    }


    /* =========================
       ẢNH CÔ GÁI
       ========================= */

    function renderGirlPicture() {

      return `

        <div class="girl-card">

          <img
            src="${randomGirlPicture}"
            alt="Birthday girl"
          >

        </div>

      `;

    }


    /* =========================
       CAKE
       ========================= */

    function renderCakeCutting() {

      return `

        <div
          class="cake-cut-area"
          id="cakeCutArea"

    /* =========================
       TẠO GAME LẬT THẺ
       ========================= */

    function createMemoryGame() {

      const board =
        document.getElementById(
          "memoryBoard"
        );

      if (!board) return;


      /*
       * Tạo 2 bản sao
       * của mỗi ảnh.
       */

      let cards = [];

      cardImages.forEach(
        (image, index) => {

          cards.push({
            id: index,
            image: image
          });

          cards.push({
            id: index,
            image: image
          });

        }
      );


      /*
       * Trộn thẻ.
       */

      cards.sort(
        () => Math.random() - 0.5
      );


      board.innerHTML = "";


      cards.forEach(
        (card, index) => {

          const cardElement =
            document.createElement(
              "div"
            );

          cardElement.className =
            "memory-card";

          cardElement.dataset.id =
            card.id;

          cardElement.dataset.index =
            index;


          cardElement.innerHTML = `

            <div class="memory-card-inner">

              <div class="memory-card-front">
              </div>

              <div class="memory-card-back">

                <img
                  src="${card.image}"
                  alt="Thẻ bí mật"
                >

              </div>

            </div>

          `;


          cardElement.addEventListener(
            "click",
            () => {

              flipMemoryCard(
                cardElement
              );

            }
          );


          board.appendChild(
            cardElement
          );

        }
      );

    }


    /* =========================
       LẬT THẺ
       ========================= */

    function flipMemoryCard(card) {

      /*
       * Không cho lật khi đang
       * kiểm tra 2 thẻ.
       */

      if (memoryLocked) return;


      /*
       * Không cho lật lại thẻ
       * đang mở.
       */

      if (
        card.classList.contains(
          "flipped"
        )
      ) return;


      /*
       * Không cho lật thẻ
       * đã tìm đúng.
       */

      if (
        card.classList.contains(
          "matched"
        )
      ) return;


      /*
       * Tối đa 2 thẻ.
       */

      if (
        flippedCards.length >= 2
      ) return;


      card.classList.add(
        "flipped"
      );

      flippedCards.push(card);


      /*
       * Khi đã có 2 thẻ
       */

      if (
        flippedCards.length === 2
      ) {

        checkMemoryMatch();

      }

    }


    /* =========================
       KIỂM TRA CẶP
       ========================= */

    function checkMemoryMatch() {

      memoryLocked = true;

      const first =
        flippedCards[0];

      const second =
        flippedCards[1];


      const firstId =
        first.dataset.id;

      const secondId =
        second.dataset.id;


      const message =
        document.getElementById(
          "memoryMessage"
        );


      /*
       * GIỐNG NHAU
       */

      if (
        firstId === secondId
      ) {

        matchedPairs++;


        if (message) {

          message.textContent =
            "Đúng rồi đó 😘 Hai thẻ giống nhau!";

        }


        setTimeout(() => {

          first.classList.add(
            "matched"
          );

          second.classList.add(
            "matched"
          );


          flippedCards = [];

          memoryLocked = false;


          updateMemoryInfo();


          /*
           * Đã tìm đủ 6 cặp.
           */

          if (
            matchedPairs >= 6
          ) {

            finishMemoryGame();

          }

        }, 450);

      }


      /*
       * KHÁC NHAU
       */

      else {

        if (message) {

          message.textContent =
            "Hông giống nhau 😝 Thử lại nha!";

        }


        setTimeout(() => {

          first.classList.remove(
            "flipped"
          );

          second.classList.remove(
            "flipped"
          );


          flippedCards = [];

          memoryLocked = false;


          if (message) {

            message.textContent =
              "Lật 2 thẻ để tìm cặp 💗";

          }

        }, 800);

      }

    }


    /* =========================
       UPDATE SỐ CẶP
       ========================= */

    function updateMemoryInfo() {

      const info =
        document.getElementById(
          "memoryInfo"
        );

      if (info) {

        info.textContent =
          `Đã tìm: ${matchedPairs} / 6 cặp`;

      }

    }


    /* =========================
       HOÀN THÀNH LẬT THẺ
       ========================= */

    function finishMemoryGame() {

      const message =
        document.getElementById(
          "memoryMessage"
        );


      if (message) {

        message.innerHTML = `
          🎉 Giỏi quá bé iu! 💝

    /* =========================
       NÚT TIẾP TỤC
       ========================= */

    nextBtn.addEventListener(
      "click",
      () => {

        /* =====================
           BƯỚC 1
           ===================== */

        if (
          currentStep === 0
        ) {

          const input =
            document.getElementById(
              "nameInput"
            );


          if (
            input &&
            input.value.trim()
          ) {

              input.value.trim();

          }

        }


        /* =====================
           BƯỚC 4
           =====================

           Chưa ghép hết:
           không cho đi tiếp.
           ===================== */

        if (
          currentStep === 3 &&
          matchedPairs < 6
        ) {

          const message =
            document.getElementById(
              "memoryMessage"
            );

          if (message) {

            message.textContent =
              "Ghép hết 6 cặp thẻ rồi mới được đi tiếp nha 😝💗";

          }

          return;

        }


        clearInterval(
          heartInterval
        );

        gameStarted = false;


        /* =====================
           BƯỚC CUỐI
           ===================== */

        if (
          currentStep === 6
        ) {

          currentStep = 0;

          /*
           * Reset game lật thẻ
           */

          resetMemoryGame();

        }

        else {

          currentStep++;

        }


        renderStep();

      }
    );


    /* =========================
       NÚT TRỞ LẠI
       ========================= */

    backBtn.addEventListener(
      "click",
      () => {

        if (
          currentStep > 0
        ) {

          clearInterval(
            heartInterval
          );

          gameStarted = false;


          currentStep--;


          /*
           * Nếu quay lại bước
           * lật thẻ thì giữ tiến độ.
           */

          renderStep();

        }

      }
    );


    /* =========================
       RESET MEMORY
       ========================= */

    function resetMemoryGame() {

      flippedCards = [];

      matchedPairs = 0;

      memoryLocked = false;

    }


    /* =========================
       GAME BẮT TIM
       ========================= */

    function startGame() {

      if (gameStarted)
        return;


      gameStarted = true;

      gameScore = 0;


      const scoreText =
        document.getElementById(
          "scoreText"
        );

      const gameBox =
        document.getElementById(
          "gameBox"
        );


      scoreText.textContent =
        "Số tym: 0 / 7";

      gameBox.innerHTML = "";


      heartInterval =
        setInterval(
          () => {

            const heart =
              document.createElement(
                "div"
              );


            heart.className =
              "heart-game";


            heart.textContent =
              [
                "💖",
                "💘",
                "💕",
                "💗",
                "💝"
              ][
                Math.floor(
                  Math.random() * 5
                )
              ];


            heart.style.left =
              Math.random() * 85 + "%";


            heart.onclick =
              () => {

                gameScore++;


                scoreText.textContent =
                  `Số tym: ${gameScore} / 7`;


                heart.remove();


                if (
                  gameScore >= 7
                ) {

                  clearInterval(
                    heartInterval
                  );


                  gameBox.innerHTML = `

                    <div style="
                      padding:45px 15px;
                      color:#ff2f7d;
                      font-weight:900;
                      font-size:20px;
                      line-height:1.6;
                    ">

                      giỏi quá bé iu ơii 💝
                      <br>

                      có quà siêu bự
                      cho bé iu nè 😘✨

                    </div>

                  `;


                  launchConfetti();

                }

              };


            gameBox.appendChild(
              heart
            );


            setTimeout(
              () => {

                heart.remove();

              },
              3000
            );


          },
          650
        );

    }


    /* =========================
       CẮT BÁNH
       ========================= */

    function cutCake() {

      if (cakeCutDone)
        return;


      const cakeArea =
        document.getElementById(
          "cakeCutArea"
        );

      const wishMessage =
        document.getElementById(
          "wishMessage"
        );


      if (!cakeArea)
        return;


      cakeCutDone = true;


      cakeArea.classList.add(
        "cutting"
      );


      setTimeout(
        () => {

          if (wishMessage) {

            wishMessage.classList.remove(
              "hidden"
            );

          }

          launchConfetti();

        },
        1200
      );

    }


    /* =========================
       SWIPE CẮT BÁNH
       ========================= */

    function setupCakeSwipe() {

      const cakeArea =
        document.getElementById(
          "cakeCutArea"
        );


      if (!cakeArea)
        return;


      /* ĐIỆN THOẠI */

      cakeArea.addEventListener(
        "touchstart",
        (e) => {

          if (cakeCutDone)
            return;


          touchStartY =
            e.touches[0].clientY;

        },
        {
          passive: true
        }
      );


      cakeArea.addEventListener(
        "touchend",
        (e) => {

          if (cakeCutDone)
            return;


          const touchEndY =
            e.changedTouches[0].clientY;


          const swipeDistance =
            touchEndY -
            touchStartY;


          if (
            swipeDistance > 60
          ) {

            cutCake();

          }

        },
        {
          passive: true
        }
      );


      /* CHUỘT */

      cakeArea.addEventListener(
        "mousedown",
        (e) => {

          if (cakeCutDone)
            return;


          mouseStartY =
            e.clientY;

          isDragging = true;

        }
      );


      cakeArea.addEventListener(
        "mouseup",
        (e) => {

          if (
            !isDragging ||
            cakeCutDone
          )
            return;


          const mouseEndY =
            e.clientY;


          const dragDistance =
            mouseEndY -
            mouseStartY;


          if (
            dragDistance > 60
          ) {

            cutCake();

          }


          isDragging = false;

        }
      );


      cakeArea.addEventListener(
        "mouseleave",
        () => {

          isDragging = false;

        }
      );

    }


    /* =========================
       TIM BAY
       ========================= */

    function createFloatingHeart() {

      const heart =
        document.createElement(
          "div"
        );


      heart.className =
        "floating-heart";


      heart.textContent =
        [
          "💖",
          "💕",
          "💗",
          "💘"
        ][
          Math.floor(
            Math.random() * 4
          )
        ];


      heart.style.left =
        Math.random() * 100 + "vw";


      heart.style.animationDuration =
        4 +
        Math.random() * 3 +
        "s";


      document.body.appendChild(
        heart
      );


      setTimeout(
        () => {

          heart.remove();

        },
        7000
      );

    }


    setInterval(
      createFloatingHeart,
      700
    );


    /* =========================
       CONFETTI
       ========================= */

    function launchConfetti() {

      const colors = [

        "#ff5f9e",
        "#ffd166",
        "#9b5de5",
        "#00bbf9",
        "#00f5d4"

      ];


      for (
        let i = 0;
        i < 50;
        i++
      ) {

        const confetti =
          document.createElement(
            "div"
          );


        confetti.className =
          "confetti";


        confetti.style.left =
          Math.random() * 100 +
          "vw";


        confetti.style.background =
          colors[
            Math.floor(
              Math.random()
              *
              colors.length
            )
          ];


        confetti.style.animationDuration =
          2 +
          Math.random() * 2 +
          "s";


        document.body.appendChild(
          confetti
        );


        setTimeout(
          () => {

            confetti.remove();

          },
          4000
        );

      }

    }


    /* =========================
