<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>Birthday Love Surprise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff0f7, #ffd6e7, #ffb6d0);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 18px;
    }

   .app {
  width: 100%;
  max-width: 450px;
  height: min(calc(100vh - 36px), 800px);

  background: rgba(255, 255, 255, 0.92);
  border-radius: 32px;
  padding: 24px;
  text-align: center;
  position: relative;

  overflow-x: hidden;
  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;

  box-shadow: 0 25px 70px rgba(255, 70, 140, 0.35);
  animation: pop 0.6s ease;
  z-index: 3;
}

/* Thanh cuộn */
.app::-webkit-scrollbar {
  width: 6px;
}

.app::-webkit-scrollbar-track {
  background: transparent;
}

.app::-webkit-scrollbar-thumb {
  background: #ff8fba;
  border-radius: 10px;
}
    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .progress {
      width: 100%;
      height: 9px;
      background: #ffe1ef;
      border-radius: 100px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 20%;
      border-radius: 100px;
      background: linear-gradient(135deg, #ff4f9a, #ff2474);
      transition: 0.4s ease;
    }

    .badge {
      display: inline-block;
      background: #fff0f7;
      color: #ff3f87;
      padding: 7px 15px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      color: #ff2f7d;
      font-size: 28px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    p {
      color: #70495b;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      border: 2px solid #ffd0e4;
      outline: none;
      border-radius: 16px;
      padding: 14px 16px;
      text-align: center;
      color: #ff2f7d;
      font-size: 15px;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #ff5f9e;
    }

    .girl-card {
      width: 135px;
      height: 135px;
      margin: 8px auto 14px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ff5f9e, #ffd166, #ff8fab);
      box-shadow: 0 15px 35px rgba(255, 79, 154, 0.28);
      animation: softFloat 3s ease-in-out infinite;
    }

    .girl-card img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
    }

    @keyframes softFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .cute-gif {
      width: 190px;
      height: 170px;
      margin: 10px auto 18px;
      border-radius: 26px;
      background: linear-gradient(145deg, #fff7fb, #ffe2ef);
      border: 2px solid #ffd0e4;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(255, 79, 154, 0.2);
    }

    .cute-gif::before,
    .cute-gif::after {
      content: "💖";
      position: absolute;
      font-size: 26px;
      animation: flyHeart 3s infinite ease-in-out;
    }

    .cute-gif::before {
      left: 20px;
      bottom: 22px;
    }

    .cute-gif::after {
      right: 22px;
      top: 25px;
      animation-delay: 0.8s;
    }

    .gif-emoji {
      font-size: 78px;
      animation: bounce 1.3s infinite ease-in-out;
      z-index: 2;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      animation: sparkle 1.8s infinite ease-in-out;
    }

    .sparkle.one {
      left: 35px;
      top: 30px;
    }

    .sparkle.two {
      right: 38px;
      bottom: 30px;
      animation-delay: 0.5s;
    }

    .sparkle.three {
      left: 78px;
      bottom: 18px;
      animation-delay: 1s;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-12px) scale(1.07);
      }
    }

    @keyframes flyHeart {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translateY(-20px) scale(1.2);
        opacity: 1;
      }
    }

    @keyframes sparkle {
      0%, 100% {
        transform: scale(0.7) rotate(0deg);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.3) rotate(25deg);
        opacity: 1;
      }
    }

    .love-note {
      background: #fff5fa;
      border: 1.5px dashed #ff8fba;
      border-radius: 18px;
      padding: 14px;
      color: #ff3f87;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s ease;
      font-size: 14px;
    }

    .btn-main {
      flex: 1;
      color: white;
      background: linear-gradient(135deg, #ff5f9e, #ff2474);
      box-shadow: 0 10px 24px rgba(255, 36, 116, 0.35);
    }

    .btn-main:hover {
      transform: translateY(-2px);
    }

    .btn-soft {
      color: #ff3f87;
      background: #fff0f7;
    }

    .game-box {
      height: 220px;
      background: linear-gradient(180deg, #fff7fb, #ffe2ef);
      border: 2px dashed #ff95bd;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      margin-top: 14px;
    }

    .heart-game {
      position: absolute;
      top: -40px;
      font-size: 32px;
      cursor: pointer;
      animation: fall 3s linear forwards;
      user-select: none;
    }

    @keyframes fall {
      to {
        top: 235px;
      }
    }

    .score {
      color: #ff2f7d;
      font-weight: 800;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .signature {
      color: #ff2f7d;
      font-size: 19px;
      font-weight: 900;
      margin-top: 12px;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 6s linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 10px;
      pointer-events: none;
      animation: confettiFall 3s linear forwards;
      z-index: 10;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* =========================
       CAKE CUTTING ANIMATION
       ========================= */

    .cake-cut-area {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 300px;
      margin: 15px auto 20px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: pan-y;
      cursor: grab;
    }

    .cake-cut-area:active {
      cursor: grabbing;
    }

    /* Bánh nguyên vẹn: hiển thị trước khi cắt */
    .cake-whole-image {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 430px;
      max-width: none;
      height: auto;
      transform: translate(-50%, -50%);
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      z-index: 4;
      transition: opacity 0.25s ease;
    }

    /* Ảnh bánh đã cắt: cake-birthday.png là MỘT ảnh chứa 2 nửa bánh */
    .birthday-cake-image {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 430px;
      max-width: none;
      height: auto;
      transform: translate(-50%, -50%) scale(0.96);
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.9s ease;
    }

    .cake-cut-area.cutting .cake-whole-image {
      opacity: 0;
    }

    .cake-cut-area.cutting .birthday-cake-image {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      filter: brightness(1.08);
    }

    @keyframes knifeCut {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(-35deg);
      }
      40% {
        opacity: 1;
        transform: translate(-25px, 70px) rotate(-35deg);
      }
      70% {
        opacity: 1;
        transform: translate(-35px, 130px) rotate(-35deg);
      }
      100% {
        opacity: 0;
        transform: translate(-45px, 200px) rotate(-35deg);
      }
    }

    @keyframes showCut {
      from {
        opacity: 0;
        transform: translateX(-50%) scaleY(0);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) scaleY(1);
      }
    }

  @media (max-width: 480px) {
  body {
    min-height: 100dvh;
    height: 100dvh;
    padding: 10px;
    align-items: center;
  }

  .app {
    width: 100%;
    height: calc(100dvh - 20px);
    max-height: calc(100dvh - 20px);
    padding: 20px;
    border-radius: 26px;

    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
  }

  h1 {
    font-size: 24px;
  }

  .cute-gif {
    width: 170px;
    height: 145px;
  }

  .gif-emoji {
    font-size: 65px;
  }

  .cake-cut-area {
    height: 250px;
  }

  .birthday-cake-image,
  .cake-whole-image {
    width: 360px;
  }
}
  </style>
</head>

<body>

  <div class="app">
    <div class="progress">
      <span id="progressBar"></span>
    </div>

    <div class="badge" id="stepBadge">Step 1 of 5</div>

    <div id="content"></div>

    <div class="buttons">
      <button class="btn-soft" id="backBtn">Trở lại</button>
      <button class="btn-main" id="nextBtn">Tiếp tục</button>
    </div>
  </div>

  <script>
    let currentStep = 0;
    let birthdayName = "Beautiful Girl";
    let gameScore = 0;
    let gameStarted = false;
    let heartInterval;

    let touchStartY = 0;
    let mouseStartY = 0;
    let isDragging = false;
    let cakeCutDone = false;

    const content = document.getElementById("content");
    const stepBadge = document.getElementById("stepBadge");
    const progressBar = document.getElementById("progressBar");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    const girlPictures = [
      "image01.JPG","image02.JPG","image03.JPG"
    ];

    const randomGirlPicture =
      girlPictures[Math.floor(Math.random() * girlPictures.length)];

    function cuteGif(emoji) {
      return `
        <div class="cute-gif">
          <span class="sparkle one">✨</span>
          <span class="sparkle two">🌸</span>
          <span class="sparkle three">✨</span>
          <div class="gif-emoji">${emoji}</div>
        </div>
      `;
    }

    function renderGirlPicture() {
      return `
        <div class="girl-card">
          <img 
            src="${randomGirlPicture}" 
            alt="Birthday girl"
            onerror="this.src='https://randomuser.me/api/portraits/women/44.jpg'"
          />
        </div>
      `;
    }

    function renderCakeCutting() {
      return `
        <div class="cake-cut-area" id="cakeCutArea">

          <!-- Bánh nguyên vẹn: hiển thị trước khi cắt -->
          <img
            src="cake-whole.png"
            class="cake-whole-image"
            alt="Bánh kem sinh nhật nguyên vẹn"
          >

          <div class="knife"></div>
          <div class="cut-line"></div>

          <!-- Sau khi cắt: dùng MỘT ảnh cake-birthday.png đã được cắt sẵn -->
          <img
            src="cake-birthday.png"
            class="birthday-cake-image"
            alt="Bánh sinh nhật sau khi cắt"
          >

        </div>
      `;
    }

    function renderStep() {
      stepBadge.textContent = `Step ${currentStep + 1} of 5`;
      progressBar.style.width = `${((currentStep + 1) / 5) * 100}%`;

      backBtn.style.visibility = currentStep === 0 ? "hidden" : "visible";
      nextBtn.textContent = currentStep === 4 ? "Quay lại" : "Tiếp tục";

      if (currentStep === 0) {
        content.innerHTML = `
          <h1>Ngày Giáng Trần của thiên thần 💝</h1>
          ${renderGirlPicture()}
          ${cuteGif("🎁")}
          <p>Nhập tên bé iuu vào nè 😘😘 </p>
          <input id="nameInput" placeholder="Nhập đây nè bà già ...." />
          <div class="love-note">
            Có bất ngờ đó bà già, ráng chơi tới cuối nghe hăm 🤣 ✨
          </div>
        `;
      }

      if (currentStep === 1) {
        content.innerHTML = `
          <h1>Gởi ${birthdayName} yêu dấu ❤🌸</h1>
          ${renderGirlPicture()}
          ${cuteGif("💕")}
          <p>
            Hôm nay là 1 ngày đặc biệt, ngày mà thiên thần giáng thế,
            là khi ngôi sao hi vọng mang tên ${birthdayName} đáp xuống trần giang
            cứu rỗi con tym cằn cỗi của tui 😘😘😘😘
          </p>
          <div class="love-note">
            Trách nhiệm của tui là giữ cho ngôi sao hình trái tym đó luôn sáng tỏ
            và rực rỡ k thôi 💖
          </div>
        `;
      }

      if (currentStep === 2) {
        content.innerHTML = `
          <h1>Bắt lấy tềnh iu của tuiii 😁💘</h1>
          ${cuteGif("💘")}
          <p>Hãy bắt lấy những "Chái tym" của tui và giữ đó nhóe</p>
          <button class="btn-main" onclick="startGame()">Bắt đầu</button>
          <div class="score" id="scoreText">Số tym: 0 / 7</div>
          <div class="game-box" id="gameBox"></div>
        `;
      }

      if (currentStep === 3) {
        cakeCutDone = false;

        content.innerHTML = `
          <h1>Cắt bánh kem nè 🎂</h1>
          <p>Hãy cắt bánh để nhận lời chúc nhé 💗</p>

          ${renderCakeCutting()}

          

          <div class="love-note hidden" id="wishMessage">
          Cắt bánh xịn thế . nhớ chia cho mọi người nhé ❤✨
          </div>
        `;

        setupCakeSwipe();
      }

      if (currentStep === 4) {
        content.innerHTML = `
          <h1>Happy Birthday, Bé iu ${birthdayName}! 🎉</h1>
          ${renderGirlPicture()}
          ${cuteGif("🎉")}
          <p>
            Mong cho bé iu luôn may mắn, yêu đời, mạnh khỏe và nhớ là thương t nhìu nhìu dô á 🤣🤣
          </p>
          <div class="love-note">
            Hy vong chúng mình sẽ cùng làm thật nhiều điều với nhau, luôn có nhau dù ra sao   💗
          </div>
          <div class="signature"> Thiên thần đáng iu 💖</div>
        `;

        launchConfetti();
      }
    }

    nextBtn.addEventListener("click", () => {
      if (currentStep === 0) {
        const input = document.getElementById("nameInput");

        if (input && input.value.trim()) {
          birthdayName = input.value.trim();
        }
      }

      clearInterval(heartInterval);
      gameStarted = false;

      if (currentStep === 4) {
        currentStep = 0;
      } else {
        currentStep++;
      }

      renderStep();
    });

    backBtn.addEventListener("click", () => {
      if (currentStep > 0) {
        clearInterval(heartInterval);
        gameStarted = false;
        currentStep--;
        renderStep();
      }
    });

    function startGame() {
      if (gameStarted) return;

      gameStarted = true;
      gameScore = 0;

      const scoreText = document.getElementById("scoreText");
      const gameBox = document.getElementById("gameBox");

      scoreText.textContent = "Số tym: 0 / 7";
      gameBox.innerHTML = "";

      heartInterval = setInterval(() => {
        const heart = document.createElement("div");

        heart.className = "heart-game";
        heart.textContent =
          ["💖", "💘", "💕", "💗", "💝"][
            Math.floor(Math.random() * 5)
          ];

        heart.style.left = Math.random() * 85 + "%";

        heart.onclick = () => {
          gameScore++;

          scoreText.textContent = `Số tym: ${gameScore} / 7`;

          heart.remove();

          if (gameScore >= 7) {
            clearInterval(heartInterval);

            gameBox.innerHTML = `
              <div style="
                padding:45px 15px;
                color:#ff2f7d;
                font-weight:900;
                font-size:20px;
                line-height:1.6;
              ">
                giỏi quá bé iu ơii 💝<br>
                có quà siêu bự cho bé iu nè 😘✨
              </div>
            `;

            launchConfetti();
          }
        };

        gameBox.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 3000);

      }, 650);
    }

    function cutCake() {
      if (cakeCutDone) return;

      const cakeArea = document.getElementById("cakeCutArea");
      const wishMessage = document.getElementById("wishMessage");

      if (!cakeArea) return;

      cakeCutDone = true;
      cakeArea.classList.add("cutting");

      setTimeout(() => {
        if (wishMessage) {
          wishMessage.classList.remove("hidden");
        }

        launchConfetti();
      }, 1200);
    }

    function setupCakeSwipe() {
      const cakeArea = document.getElementById("cakeCutArea");

      if (!cakeArea) return;

      /* =========================
         ĐIỆN THOẠI
         ========================= */

      cakeArea.addEventListener("touchstart", (e) => {
        if (cakeCutDone) return;

        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      cakeArea.addEventListener("touchend", (e) => {
        if (cakeCutDone) return;

        const touchEndY = e.changedTouches[0].clientY;
        const swipeDistance = touchEndY - touchStartY;

        if (swipeDistance > 60) {
          cutCake();
        }
      }, { passive: true });


      /* =========================
         LAPTOP / CHUỘT
         ========================= */

      cakeArea.addEventListener("mousedown", (e) => {
        if (cakeCutDone) return;

        mouseStartY = e.clientY;
        isDragging = true;
      });

      cakeArea.addEventListener("mouseup", (e) => {
        if (!isDragging || cakeCutDone) return;

        const mouseEndY = e.clientY;
        const dragDistance = mouseEndY - mouseStartY;

        if (dragDistance > 60) {
          cutCake();
        }

        isDragging = false;
      });

      cakeArea.addEventListener("mouseleave", () => {
        isDragging = false;
      });
    }

    function createFloatingHeart() {
      const heart = document.createElement("div");

      heart.className = "floating-heart";

      heart.textContent =
        ["💖", "💕", "💗", "💘"][
          Math.floor(Math.random() * 4)
        ];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createFloatingHeart, 700);

    function launchConfetti() {
      const colors = [
        "#ff5f9e",
        "#ffd166",
        "#9b5de5",
        "#00bbf9",
        "#00f5d4"
      ];

      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");

        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDuration =
          2 + Math.random() * 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 4000);
      }
    }

    renderStep();
  </script>

</body>
</html>
